name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]   # une fois par jour
  workflow_dispatch:                # lancement manuel
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
